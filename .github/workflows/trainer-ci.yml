name: Trainer CI

on:
  pull_request:
    paths:
      - "trainer/**"
      - ".github/workflows/trainer-ci.yml"
  push:
    branches:
      - main
      - Feature3TrainingPipeline
    paths:
      - "trainer/**"
      - ".github/workflows/trainer-ci.yml"

permissions:
  contents: read

concurrency:
  group: trainer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify trainer
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: trainer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trainer/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Test image validation
        run: python -m unittest discover -s test -v
