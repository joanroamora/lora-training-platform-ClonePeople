name: Terraform CI

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches:
      - main
      - Feature1IaC
      - Feature3TrainingPipeline
    paths:
      - "infra/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize bootstrap without backend
        run: terraform -chdir=infra/bootstrap init -backend=false -input=false

      - name: Validate bootstrap
        run: terraform -chdir=infra/bootstrap validate

      - name: Initialize development environment without backend
        run: terraform -chdir=infra/environments/dev init -backend=false -input=false

      - name: Validate development environment
        run: terraform -chdir=infra/environments/dev validate
